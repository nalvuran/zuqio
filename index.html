<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuqio</title>
<meta name="description" content="Arkadaşlarınla canlı bilgi yarışması. Oda aç, kodu paylaş, aynı anda cevapla.">
<meta name="theme-color" content="#22105A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zuqio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#22105A; --surface:#311C82; --ink:#FFFFFF; --muted:#B8ACEB; --line:#4733A6;
  --indigo:#7B5CFF; --coral:#E5333B; --teal:#2FA84F; --amber:#FFC21A; --good:#2FA84F; --bad:#E5333B;
  --soft:#2A1670; --yellow:#FFC21A; --red:#E5333B; --blue:#1E78F5; --green:#2FA84F;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#22105A; --surface:#311C82; --ink:#FFFFFF; --muted:#B8ACEB; --line:#4733A6; --soft:#2A1670;
  }
}
:root[data-theme="dark"]{ --bg:#22105A; --surface:#311C82; --ink:#FFFFFF; --muted:#B8ACEB; --line:#4733A6; --soft:#2A1670; }
*,*::before,*::after{box-sizing:border-box}
html{background:#170941; -webkit-text-size-adjust:100%}
body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; margin:0; color:var(--ink);
  font-family:"Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
/* Arka plan tüm ekranı (çentik ve alt çubuk dahil) kaplar */
body::before{content:''; position:fixed; left:0; top:0; right:0; bottom:calc(-1 * var(--vgap, 0px)); z-index:-1;
  background:radial-gradient(130% 75% at 50% 22%, #3B1C9C 0%, var(--bg) 62%, #170941 100%)}
/* Uygulama alanı ekranın tamamını kaplar; güvenli alan boşlukları içeride bırakılır */
#app{position:fixed; left:0; right:0; top:0; bottom:calc(-1 * var(--vgap, 0px)); overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{flex:1; display:flex; flex-direction:column; width:100%; max-width:460px; margin:0 auto; padding:16px 18px 20px}
.screen{zoom:var(--z,1)}
.anncard{zoom:var(--z,1)}
h1{font-size:2.1rem; line-height:1.05; font-weight:800; margin:0; letter-spacing:-.02em}
h2{font-size:1.5rem; font-weight:800; margin:0; letter-spacing:-.01em}
p{margin:0; line-height:1.45}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.grow{flex:1}
input,textarea,select,.code,[contenteditable]{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default}
.btn.green{background:var(--green); color:#0B3D1F; border-color:var(--green); box-shadow:0 5px 0 #1F7A3C}
@media (max-height:720px){.home-btns{gap:10px !important}.home-btns .btn.big{min-height:54px}.home-btns .btn.big .ic{width:40px;height:40px}}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
button:focus-visible, input:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.btn{display:flex; align-items:center; justify-content:center; gap:10px; min-height:56px; padding:0 20px;
  border-radius:16px; font-weight:600; font-size:1.05rem; background:var(--surface); border:1.5px solid var(--line)}
.btn.primary{background:var(--yellow); color:#3A2200; border-color:var(--yellow); box-shadow:0 5px 0 #C48700}
.btn.purple{background:#5B3BD6; color:#fff; border-color:#5B3BD6; box-shadow:0 5px 0 #3A2296}
.btn.gbtn{background:#fff; color:#1F1F1F; border-color:#fff; border-radius:999px; min-height:56px; font-weight:600; box-shadow:0 4px 0 rgba(0,0,0,.25)}
.gslot{width:22px; height:22px; border-radius:50%; border:2px dashed #B9B9B9}
.btn.outline{background:transparent; border-color:var(--line); color:#fff}
.btn.big{min-height:62px; border-radius:999px; font-size:clamp(.95rem,4.4vw,1.15rem); font-weight:800; letter-spacing:0; justify-content:flex-start; padding:0 10px}
.btn.big .ic{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.12); flex:0 0 auto}
.btn.big .ic svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.btn.big .lb{flex:1; text-align:center; padding-right:36px; white-space:nowrap}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted); min-height:44px}
.btn:disabled{opacity:.45; cursor:default}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:none}
input.field,textarea.field,select.field{width:100%; min-height:56px; padding:0 16px; border-radius:16px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-size:1.1rem}
.top{display:flex; align-items:center; justify-content:space-between; min-height:48px; margin-bottom:8px}
.avatar{width:40px; height:40px; border-radius:50%; background:#3A2496; display:grid; place-items:center; flex:0 0 auto; overflow:hidden}
.avatar svg{width:88%; height:88%}
.avpick{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.avpick button{aspect-ratio:1; border-radius:50%; background:#3A2496; border:3px solid transparent; display:grid; place-items:center}
.avpick button svg{width:92%; height:92%}
.avpick button.on{border-color:var(--yellow); box-shadow:0 0 0 3px rgba(255,194,26,.25)}
.avbig{width:112px; height:112px; margin:0 auto}
.back{display:flex; align-items:center; gap:6px; min-height:44px; color:var(--muted); font-weight:600}
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:16px}
.tag{display:inline-block; font-size:.78rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--muted)}
.demo{font-size:.82rem; color:var(--muted); text-align:center; padding:10px 6px 0}

/* logo */
.hero{text-align:center}
.logo4{display:grid; grid-template-columns:repeat(2,64px); gap:4px; justify-content:center; filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.logo4 img{width:68px; height:68px; display:block}
.wordmark{font-size:4.4rem; line-height:1; font-weight:800; letter-spacing:.01em; margin-top:6px; color:#fff;
  text-shadow:0 4px 0 #B9A6FF, 0 9px 0 #3A2296, 0 14px 18px rgba(0,0,0,.35)}
.wordmark span{color:var(--yellow); text-shadow:0 4px 0 #E39A00, 0 9px 0 #3A2296, 0 14px 18px rgba(0,0,0,.35)}
.slogan{font-weight:600; font-size:1.15rem; margin-top:14px}
.slogan .y{color:var(--yellow)} .slogan .g{color:#5BD07A}
.bottomnav{display:grid; grid-template-columns:repeat(5,1fr); gap:2px; width:100%; max-width:460px; margin:0 auto; padding:4px 6px 0; zoom:var(--z,1)}
.gnav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:#1a0c47; border-top:1px solid var(--line); padding-bottom:max(0px, calc(env(safe-area-inset-bottom,0px) - var(--vgap,0px)))}
.gnav-sp{flex:none; height:calc(66px * var(--z,1))}
body.kb .gnav{display:none}
.bottomnav button.on{color:var(--yellow)}
.bottomnav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:56px; color:var(--muted); font-size:.62rem; letter-spacing:-.01em; line-height:1.15; text-align:center; font-weight:600}
.bottomnav svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.me-chip{display:flex; align-items:center; gap:8px; font-weight:600; min-height:44px; color:#fff}

/* home menu */
.menu-main{min-height:120px; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:18px; font-size:1.35rem; font-weight:800; text-align:left}
.menu-main small{font-size:.92rem; font-weight:400; opacity:.85}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.menu-grid .btn{flex-direction:column; min-height:96px; gap:6px; font-size:1rem}
.menu-grid svg{width:26px; height:26px; stroke:var(--yellow); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* lobby */
.code{font-size:3rem; font-weight:800; letter-spacing:.12em; text-align:center; font-variant-numeric:tabular-nums}
.plist{display:flex; flex-direction:column; gap:8px}
.pitem{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line)}
.pitem .avatar{width:38px; height:38px}
@media (prefers-reduced-motion: no-preference){ .pitem.new{animation:pop .35s ease-out} }
@keyframes pop{from{transform:scale(.92); opacity:0} to{transform:none; opacity:1}}

/* question */
.qhead{display:flex; align-items:center; justify-content:space-between; gap:10px}
.hex{width:62px; height:56px; display:grid; place-items:center; background:var(--indigo); color:#fff; font-weight:800; font-size:1.35rem;
  clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%); font-variant-numeric:tabular-nums; transition:background .3s}
.hex.low{background:var(--coral)}
.hex.ice{background:#5FA8D3}
.bar{height:6px; border-radius:6px; background:var(--soft); overflow:hidden; margin:12px 0 18px}
.bar i{display:block; height:100%; background:var(--yellow); width:100%}
.qtext{font-size:1.5rem; line-height:1.25; font-weight:600; letter-spacing:-.01em}
.status{font-size:.92rem; color:var(--muted); min-height:1.4em; text-align:center; margin:10px 0}
.jokers{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px}
.joker{flex:1 1 auto; justify-content:center; white-space:nowrap; display:flex; align-items:center; gap:5px; min-height:40px; padding:0 8px; border-radius:999px; background:var(--surface); border:1.5px solid var(--line); font-size:.78rem; font-weight:600}
.joker svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
@media (max-width:410px){.joker svg{display:none} .joker{padding:0 6px}}
.joker.on{background:var(--indigo); color:#fff; border-color:var(--indigo)}
.joker:disabled{opacity:.35}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:14px 10px; padding-bottom:6px}
.ans{min-height:104px; border-radius:18px; color:#fff; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; padding:14px; text-align:left; font-weight:600; font-size:1.08rem; line-height:1.2}
.ans img{width:48px; height:48px; display:block; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.ans{background:#3A2496; border:2px solid #4D36B8; color:#fff}
.ans.c0{box-shadow:0 6px 0 var(--yellow)} .ans.c1{box-shadow:0 6px 0 var(--red)} .ans.c2{box-shadow:0 6px 0 var(--blue)} .ans.c3{box-shadow:0 6px 0 var(--green)}
.ans:active:not(:disabled){transform:translateY(4px); box-shadow:none}
.ans:disabled{cursor:default}
.ans.dim{opacity:.35}
.ans.gone{visibility:hidden}
.ans.mine{outline:4px solid #fff; outline-offset:2px}
.numbox{display:flex; gap:10px}
.numbox input{font-size:1.4rem; font-weight:600; text-align:center}
.hint{background:var(--soft); border-radius:14px; padding:10px 14px; font-weight:600; margin-bottom:10px; text-align:center}

/* reveal */
.verdict{border-radius:22px; padding:22px 18px; color:#fff; text-align:center}
.verdict.good{background:var(--good)} .verdict.bad{background:var(--bad)} .verdict.mid{background:var(--yellow); color:#3A2200}
.verdict b{display:block; font-size:2rem; font-weight:800; letter-spacing:-.02em}
.rank{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line)}
.rank.me{border-color:var(--yellow); border-width:2px}
.rank .n{width:22px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
.rank .pts{margin-left:auto; font-weight:900; font-size:1.3rem; letter-spacing:.01em; font-variant-numeric:tabular-nums}
.rank .delta{font-size:.85rem; color:var(--good); font-weight:600; min-width:48px; text-align:right}
.linkbtn{color:var(--muted); text-decoration:underline; font-size:.9rem; min-height:44px}

/* countdown */
.count{flex:1; display:grid; place-items:center; font-size:8rem; font-weight:800; color:var(--yellow)}

/* podium */
.podium{display:grid; grid-template-columns:1fr 1fr 1fr; align-items:end; gap:8px; margin:12px 0 4px}
.pod{text-align:center}
.pod .blk{border-radius:14px 14px 4px 4px; color:#fff; font-weight:800; font-size:1.6rem; display:grid; place-items:center; margin-top:6px}
.pod .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod .sc{font-size:1.3rem; font-weight:900; letter-spacing:.01em; color:#fff; font-variant-numeric:tabular-nums}
.pod .sc.first{font-size:1.43rem}

/* tabs */
.tabs{display:grid; grid-template-columns:repeat(3,1fr); background:var(--soft); border-radius:14px; padding:4px; gap:4px; margin-bottom:12px}
.tabs button{min-height:42px; border-radius:10px; font-weight:600; color:var(--muted)}
.tabs button.on{background:var(--surface); color:var(--ink)}

.toastq{bottom:auto !important; top:calc(190px + env(safe-area-inset-top,0px)) !important}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#fff; color:#22105A;
  padding:12px 18px; border-radius:14px; font-weight:600; font-size:.95rem; max-width:90%; text-align:center; z-index:9}

/* --- canlı sürüm ekleri --- */
.chips{display:flex; gap:8px}
.chips button{flex:1; min-height:46px; border-radius:12px; background:var(--surface); border:1.5px solid var(--line); font-weight:800; color:#fff}
.chips button.on{background:var(--yellow); color:#3A2200; border-color:var(--yellow)}
.pitem.off{opacity:.45}
.glogo{width:22px; height:22px}
.coin{width:18px; height:18px; flex:0 0 auto}
.coinchip,.coinbar{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 14px; border-radius:999px; background:rgba(255,255,255,.1); font-weight:800; color:#fff}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.day{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; border-radius:12px; background:var(--surface); border:1.5px solid var(--line)}
.day .n{color:var(--muted); font-size:.64rem; line-height:1; white-space:nowrap}
.day b{font-size:.95rem; line-height:1}
.day.done{opacity:.5}
.day.done .n::after{content:'✓'; margin-left:2px}
.day.today{border-color:var(--yellow); box-shadow:0 0 0 3px rgba(255,194,26,.25)}
.shopgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.shopitem{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px 8px; min-height:156px; border-radius:18px; background:var(--surface); border:1.5px solid var(--line); color:#fff}
.shopitem .avatar{width:76px; height:76px}
.shopitem .price{display:inline-flex; align-items:center; gap:5px; font-weight:800; color:var(--yellow)}
.shopitem.own .price{color:var(--muted)}
.shopitem.cur{border-color:var(--yellow)}
.shopitem:active:not(:disabled){transform:scale(.97)}
.dqa .ans{min-height:84px}
.ans.right{outline:3px solid #5BD07A; outline-offset:2px; opacity:1}
.ans.wrongpick{outline:3px solid #ff6b6b; outline-offset:2px; opacity:1}
.bottomnav button{position:relative}
.bottomnav .hasdot::after{content:''; position:absolute; top:6px; left:calc(50% + 10px); width:11px; height:11px; border-radius:50%; background:var(--red); border:2px solid #170941}
.avpick{grid-template-columns:repeat(4,1fr)}
.chips.wrap{flex-wrap:wrap}
.chips.wrap button{flex:0 0 auto; padding:0 16px}
.infocard{margin-top:12px; padding:12px 16px}
.infocard p{margin-top:4px; color:var(--muted); font-size:.95rem; line-height:1.4}
a.setrow{color:inherit; text-decoration:none}
.a2link{background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--ink); padding:8px 16px; border-radius:999px; font-size:.85rem; font-weight:700}
.a2card{position:relative; width:min(88vw,360px); background:var(--surface); border:1.5px solid var(--line); border-radius:26px; padding:26px 22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.5); zoom:var(--z,1)}
.a2t{display:block; font-size:1.2rem; margin:0 30px 14px 0}
.a2steps{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:12px; font-size:.98rem; line-height:1.45}
.a2steps b{color:var(--yellow)}
.a2ic{width:20px; height:20px; vertical-align:-4px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.screen p a{color:var(--yellow)}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:68px; padding:10px 0; width:100%; text-align:left; border-bottom:1px solid var(--line)}
/* oda ekranı: her şey tek ekrana sığsın; oyuncu listesi kalan boşluğu alır ve gerekirse kayar */
.screen.lobby{min-height:0; height:100%; flex:1 1 0; padding-top:8px; padding-bottom:calc(22px + var(--vgap,0px))}
.lobby .top{margin-bottom:6px}
.codecard{position:relative}
.copybtn{position:absolute; right:8px; bottom:8px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--muted); background:rgba(255,255,255,.07)}
.copybtn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.copybtn:active{transform:scale(.9); color:#fff}
.lobby .codecard{padding:8px 12px !important; gap:0 !important}
.lobby .code{font-size:2.3rem; line-height:1.15}
.lobby .codecard .btn{min-height:34px}
.lobby .plhead{margin:10px 0 6px !important}
.lobby .plist{flex:1 1 auto; min-height:52px; overflow-y:auto; gap:6px}
.lobby .pitem{flex:0 0 auto; padding:7px 12px}
.lobby .reactbar{padding:8px 0 2px; flex:0 0 auto}
.lobby .chips button{min-height:40px}
.lobby .lsp{flex:0 0 8px}
.lobby .pubrow{margin-bottom:8px; min-height:56px}
.lobby .catrow{min-height:56px; margin-bottom:10px !important}
.lobby .btn.big{min-height:56px; flex:0 0 auto}
.lobby .lbl{margin-bottom:4px !important}
.setrow:last-child{border-bottom:0}
.setrow > div, .setrow > span{display:flex; flex-direction:column; gap:2px; min-width:0}
.setrow .small{font-weight:400; line-height:1.3}
.setrow > span.muted{font-size:1.6rem}
.switch{position:relative; flex:0 0 auto; width:56px; height:32px; border-radius:999px; background:#4A3A9E; border:0; transition:background .2s}
.switch::after{content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .2s}
.switch.on{background:var(--yellow)}
.switch.on::after{transform:translateX(24px)}
.switch:disabled{opacity:.35}
@media (prefers-reduced-motion: reduce){.switch,.switch::after{transition:none}}
.numbox input::placeholder{font-size:1rem; font-weight:500}
.row .tag + .tag{margin-left:6px}

.tabs button.on{background:var(--yellow); color:#3A2200}
/* durum çubuğu altına kayan içeriği örten şerit (ana ekrana eklenmiş uygulamada) */
html::after{content:""; position:fixed; left:0; right:0; top:0; height:env(safe-area-inset-top,0px); background:rgba(30,14,80,.94); z-index:20; pointer-events:none}

/* çerçeveler */
@property --fa{syntax:'<angle>'; inherits:false; initial-value:0deg}
.avatar.fr1{box-shadow:0 0 0 3px #FFC21A, 0 0 0 5px #B87F00}
.avatar.fr4{box-shadow:0 0 0 3px #D8F6FF, 0 0 0 5px #5EBBF5, 0 0 12px 2px rgba(110,200,255,.55)}
.avatar.fr6{box-shadow:0 0 0 3px #12083A, 0 0 0 5px #FFC21A, 0 0 14px 3px rgba(123,92,255,.7)}
.avatar.fr2{box-shadow:0 0 0 3px #3DF5FF, 0 0 14px 4px rgba(61,245,255,.65)}
.avatar.fr3,.avatar.fr5{border:3px solid transparent; --fa:0deg}
.avatar.fr3{background:linear-gradient(#3A2496,#3A2496) padding-box, conic-gradient(from var(--fa), #E5333B, #FFC21A, #2FA84F, #1E78F5, #7B5CFF, #E5333B) border-box}
.avatar.fr5{background:linear-gradient(#3A2496,#3A2496) padding-box, conic-gradient(from var(--fa), #FF3B1F, #FFB21A, #FF6A00, #FFE15A, #FF3B1F) border-box; box-shadow:0 0 14px 3px rgba(255,106,0,.55)}
@media (prefers-reduced-motion: no-preference){
  .avatar.fr3,.avatar.fr5{animation:frspin 3s linear infinite}
  .avatar.fr2{animation:frpulse 1.6s ease-in-out infinite}
}
@keyframes frspin{to{--fa:360deg}}
@keyframes frpulse{50%{box-shadow:0 0 0 3px #3DF5FF, 0 0 22px 7px rgba(61,245,255,.85)}}
.shopitem .avatar{margin:6px 0}
.tabs.four{grid-template-columns:repeat(4,1fr); margin-bottom:0}
.tabs.four button{font-size:.88rem}
.remos{font-size:1.5rem; letter-spacing:4px}
.buyb{min-height:44px; padding:0 14px; gap:6px}
.buyb .coin{width:20px; height:20px}
.shieldic{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:#3A2496; color:var(--yellow)}
.shieldic svg{width:32px; height:32px; fill:none; stroke:currentColor; stroke-width:1.8}
/* tepkiler */

#rotlock{display:none;position:fixed;inset:0;z-index:99999;background:#22105A;color:#fff;align-items:center;justify-content:center;text-align:center;font-weight:700}
#rotlock div{font-size:2.4rem}
#rotlock p{font-size:1rem;margin-top:8px}
@media (orientation:landscape) and (max-height:500px){#rotlock{display:flex}}
.qmbar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.qmbar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .3s linear}
.reactbar{display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none}
.reactbar::-webkit-scrollbar{display:none}
.reactbar button{flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line); font-size:1.35rem; display:grid; place-items:center}
.reactbar button:active{transform:scale(.88)}
.rfly{position:fixed; bottom:calc(120px + env(safe-area-inset-bottom,0px)); z-index:30; pointer-events:none; display:flex; flex-direction:column; align-items:center; animation:rfly 2.6s ease-out forwards}
.rfly .re{font-size:2.6rem; line-height:1; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.rfly .rn{font-size:.75rem; font-weight:800; background:rgba(0,0,0,.45); color:#fff; padding:1px 8px; border-radius:999px; margin-top:2px}
@keyframes rfly{0%{transform:translateY(20px) scale(.6); opacity:0} 12%{transform:translateY(0) scale(1.1); opacity:1} 80%{opacity:1} 100%{transform:translateY(-260px) scale(1); opacity:0}}

.donebox{min-height:56px; border-radius:999px; display:grid; place-items:center; font-weight:800; color:#5BD07A; background:rgba(47,168,79,.12); border:1.5px solid rgba(91,208,122,.45)}
.dqres{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-radius:14px}
.dqres.ok{background:rgba(47,168,79,.18); border:1.5px solid rgba(91,208,122,.5)}
.dqres.no{background:rgba(229,51,59,.15); border:1.5px solid rgba(255,107,107,.45)}
.dqres b{font-size:1.1rem} .dqres span{color:var(--muted); font-size:.92rem}
.dqdone .btn{min-height:48px}

.annmodal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(10,4,30,.72); animation:annfade .2s ease}
.anncard{position:relative; width:min(86vw,340px); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#3DBB5C,#2A9444); border-radius:32px; padding:44px 26px 30px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.25); animation:annpop .28s cubic-bezier(.2,1.3,.4,1)}
.annleaf{position:absolute; inset:14%; width:72%; height:72%; opacity:.16; pointer-events:none}
.anncard p{position:relative; margin:0; font-size:1.3rem; font-weight:800; line-height:1.35; color:#fff; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; max-height:100%; overflow:auto; text-shadow:0 1px 2px rgba(0,0,0,.25)}
.annx{position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; color:#fff; background:rgba(0,0,0,.2); font-size:1.05rem}
@keyframes annfade{from{opacity:0}to{opacity:1}}
@keyframes annpop{from{transform:scale(.85); opacity:0}to{transform:scale(1); opacity:1}}
.annbar{display:flex; align-items:flex-start; gap:10px; padding:12px 12px 12px 14px; border-radius:16px; background:rgba(255,194,26,.14); border:1.5px solid rgba(255,194,26,.5); margin-bottom:6px}
.annbar p{flex:1; margin:0; font-weight:600; line-height:1.35}
.annbar button{width:32px; height:32px; border-radius:50%; color:var(--muted); flex:0 0 auto}

.qzst{font-size:.75rem; font-weight:800; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap}
.qzst.wait{background:rgba(255,194,26,.18); color:var(--yellow)}
.qzst.ok{background:rgba(47,168,79,.2); color:#5BD07A}
.qzst.bad{background:rgba(229,51,59,.2); color:#FF9DA0}
.qzo.right{border-color:rgba(91,208,122,.7)}
select.field{appearance:none; -webkit-appearance:none}
textarea.field{min-height:64px; padding-top:12px; resize:vertical; font:inherit}

.pubrow{padding:6px 16px; margin-bottom:12px; border-bottom:1.5px solid var(--line)}
.roomcard{width:100%; color:#fff}
.roomcard:active:not(:disabled){transform:scale(.98)}
@media (max-height:720px){.logo4{grid-template-columns:repeat(2,44px)}.logo4 img{width:46px;height:46px}.wordmark{font-size:3.1rem}.slogan{font-size:1rem;margin-top:8px}}
@media (max-height:680px){.slogan{display:none}.wordmark{margin-top:2px}}
.botic{display:inline-flex; vertical-align:-3px; width:1.05em; height:1.05em; margin-left:2px; opacity:.85}
.botic svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
</style>
</head>

<div id="rotlock" aria-hidden="true"><div>📱<p>Zuqio dikey oynanır.<br>Telefonu dik tut.</p></div></div>
<div id="app"><div class="screen"><p class="status" style="margin:auto">Yükleniyor…</p></div></div>
<noscript><p style="padding:20px;color:#fff">Zuqio'yu oynamak için JavaScript'i açman gerekiyor.</p></noscript>
<script>
(function(){
  function z(){ try{
    var w=window.innerWidth,h=window.innerHeight,v=Math.min(w/520,h/700);
    v=Math.max(1,Math.min(1.6,Math.round(v*20)/20));
    document.documentElement.style.setProperty('--z',v);
  }catch(e){} }
  z(); window.addEventListener('resize',z); window.addEventListener('orientationchange',z);
})();
</script>
<script>
/* iOS'ta ana ekrandan açılan uygulamada görünür alan ekrandan kısa kalabiliyor (altta boş şerit).
   Farkı ölçüp uygulama alanını ekranın en altına kadar uzatıyoruz. */
(function(){
  function fix(){
    var sa = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var portrait = window.innerHeight > window.innerWidth;
    var gap = 0;
    if (sa && portrait) { gap = Math.max(0, screen.height - window.innerHeight); if (gap > 120) gap = 0; }
    document.documentElement.style.setProperty('--vgap', gap + 'px');
  }
  fix(); window.addEventListener('resize', fix); window.addEventListener('orientationchange', function(){ setTimeout(fix, 300); });
})();
</script>
<script>try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(function(){})}catch(e){}</script>
<script type="module" src="app.js"></script>
