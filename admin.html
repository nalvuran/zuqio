<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zuqio Yönetim</title>
<meta name="theme-color" content="#22105A">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A0C47; --surface:#2A1670; --line:#41309A; --ink:#fff; --muted:#B8ACEB; --yellow:#FFC21A; --red:#FF5A5F; --green:#5BD07A}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:"Baloo 2", system-ui, -apple-system, sans-serif; -webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
.wrap{max-width:980px; margin:0 auto; padding:16px}
.wrap.narrow{max-width:420px; padding-top:12vh}
h1{font-size:1.5rem; margin:0 0 14px; font-weight:800}
h1 span{color:var(--yellow)}
header h1{margin:0}
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.gap{gap:8px; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.right{text-align:right}
.small{font-size:.88rem} .muted{color:var(--muted)}
label{display:flex; flex-direction:column; gap:4px; font-weight:600}
.field{width:100%; min-height:48px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:#1F1057; color:#fff; font:inherit; font-size:1rem}
textarea.field{resize:vertical}
.btn{min-height:44px; padding:0 16px; border-radius:12px; background:#36208A; border:1.5px solid var(--line); font-weight:700}
.btn.primary{background:var(--yellow); color:#3A2200; border-color:var(--yellow)}
.btn.danger{background:rgba(255,90,95,.15); border-color:rgba(255,90,95,.5); color:#FF9DA0}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.danger-t{color:#FF9DA0 !important}
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 auto; min-height:38px; padding:0 12px; font-size:.88rem; border-radius:999px; background:var(--surface); border:1.5px solid var(--line); font-weight:700; color:var(--muted)}
.tabs button.on{background:var(--yellow); color:#3A2200; border-color:var(--yellow)}
.tabs i{font-style:normal; background:var(--red); color:#fff; border-radius:999px; padding:0 6px; font-size:.75rem; margin-left:2px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:var(--surface); padding:4px; border-radius:12px; margin-bottom:12px}
.seg button{min-height:38px; border-radius:9px; font-weight:700; color:var(--muted)}
.seg button.on{background:var(--yellow); color:#3A2200}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column}
.stat span{color:var(--muted); font-size:.85rem}
.stat b{font-size:1.8rem; line-height:1.1}
.stat small{color:var(--muted); font-size:.75rem}
.stat a{color:var(--yellow); cursor:pointer; font-weight:700}
.list{display:flex; flex-direction:column; gap:8px}
.item{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; text-align:left; width:100%}
.item .n{width:24px; color:var(--muted); font-weight:800}
.prrow{flex-wrap:wrap}
.prrow .grow{flex:1 1 0; min-width:0; word-break:break-all}
.prrow .prs{white-space:nowrap}
.prrow .prbtn{flex:0 0 100%; padding-left:34px; flex-wrap:wrap}
.tag{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; background:#3A2496; color:var(--muted); margin-left:4px}
.tag.bad{background:rgba(255,90,95,.2); color:#FF9DA0}
.note{background:#1F1057; border-radius:10px; padding:8px 10px; font-style:italic}
.warn{background:rgba(255,90,95,.15); border:1.5px solid rgba(255,90,95,.45); border-radius:12px; padding:10px; color:#FFB3B5}
.uid{display:flex; gap:8px; align-items:center; background:#1F1057; border-radius:10px; padding:8px 10px}
.uid code{flex:1; word-break:break-all; font-size:.85rem}
code{font-family:ui-monospace, Menlo, monospace}
ol{padding-left:20px; margin:0; line-height:1.6}
dl{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0}
dt{color:var(--muted)} dd{margin:0; word-break:break-word}
.sheet{position:fixed; inset:0; background:rgba(10,4,30,.7); display:flex; align-items:flex-end; justify-content:center; z-index:10; padding:12px}
.sheet .card{width:100%; max-width:560px; max-height:88vh; overflow:auto; margin-bottom:env(safe-area-inset-bottom,0)}
@media (min-width:640px){.sheet{align-items:center}}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#fff; color:#22105A; padding:12px 18px; border-radius:14px; font-weight:700; z-index:20; max-width:90%; text-align:center}
.aq{border-top:1px solid var(--line); padding-top:10px}
.field.ok{border-color:rgba(91,208,122,.7)}
select.field{appearance:auto}
.bars{display:flex; align-items:flex-end; gap:3px; height:110px; padding:6px 0 2px}
.bcol{flex:1; height:100%; display:flex; align-items:flex-end}
.bcol i{display:block; width:100%; background:var(--c,var(--yellow)); border-radius:3px 3px 0 0; min-height:0}
.crow{display:flex; flex-direction:column; gap:4px; margin:4px 0}
.cbar{height:8px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden}
.cbar i{display:block; height:100%; background:var(--yellow); border-radius:99px}
</style>
</head>
<body>
<div id="app"><p class="wrap muted">Yükleniyor…</p></div>
<script type="module" src="admin.js"></script>
</body>
</html>
